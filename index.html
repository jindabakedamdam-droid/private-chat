<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080b10;
  color:#fff;
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */
#authScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.authBox{
  width:100%;
  max-width:420px;
  background:#111722;
  border:1px solid #202a3a;
  border-radius:22px;
  padding:28px;
  box-shadow:0 15px 50px rgba(0,0,0,.45);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#8d99aa;
  margin-bottom:25px;
}

.authBox h2{
  margin-bottom:18px;
}

.input{
  width:100%;
  background:#0b1018;
  border:1px solid #293448;
  color:#fff;
  padding:14px;
  border-radius:12px;
  outline:none;
  margin-bottom:12px;
}

.input:focus{
  border-color:#4da3ff;
}

.primary{
  width:100%;
  border:0;
  background:#248cff;
  color:white;
  padding:14px;
  border-radius:12px;
  font-weight:bold;
  margin-top:5px;
}

.secondary{
  width:100%;
  border:1px solid #334056;
  background:#151c28;
  color:#fff;
  padding:13px;
  border-radius:12px;
  font-weight:bold;
  margin-top:10px;
}

.authMessage{
  min-height:22px;
  margin-top:14px;
  text-align:center;
  color:#ffb4b4;
  font-size:14px;
}

/* APP */
#appScreen{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:320px;
  border-right:1px solid #202938;
  background:#0d121b;
  display:flex;
  flex-direction:column;
}

.sideHeader{
  padding:20px;
  border-bottom:1px solid #202938;
}

.sideHeader h1{
  font-size:23px;
  margin-bottom:5px;
}

.userEmail{
  color:#7f8b9e;
  font-size:12px;
  word-break:break-all;
}

.searchBox{
  padding:14px;
  border-bottom:1px solid #202938;
}

.userList{
  flex:1;
  overflow-y:auto;
}

.userItem{
  padding:15px 18px;
  border-bottom:1px solid #171f2c;
  display:flex;
  align-items:center;
  gap:12px;
}

.userItem:hover{
  background:#151d2a;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#248cff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  flex-shrink:0;
}

.userInfo{
  min-width:0;
}

.userInfo strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.userInfo small{
  color:#7d899b;
}

.sideBottom{
  padding:15px;
  border-top:1px solid #202938;
}

.logout{
  width:100%;
  background:#171e2a;
  border:1px solid #303b4e;
  color:#fff;
  padding:12px;
  border-radius:10px;
}

/* CHAT */
.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chatHeader{
  height:70px;
  padding:12px 18px;
  border-bottom:1px solid #202938;
  display:flex;
  align-items:center;
  gap:12px;
}

.chatHeaderInfo{
  min-width:0;
}

.chatHeaderInfo strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chatHeaderInfo small{
  color:#7e899a;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.empty{
  margin:auto;
  color:#6f7b8d;
  text-align:center;
  padding:30px;
}

.message{
  max-width:75%;
  padding:10px 13px;
  border-radius:16px;
  line-height:1.4;
  word-break:break-word;
}

.message.mine{
  align-self:flex-end;
  background:#1976e8;
  border-bottom-right-radius:4px;
}

.message.theirs{
  align-self:flex-start;
  background:#192231;
  border-bottom-left-radius:4px;
}

.messageTime{
  display:block;
  font-size:10px;
  opacity:.65;
  margin-top:5px;
}

.photo{
  max-width:260px;
  width:100%;
  border-radius:12px;
  display:block;
  cursor:pointer;
}

.composer{
  padding:12px;
  border-top:1px solid #202938;
  display:flex;
  gap:8px;
  align-items:center;
  background:#0d121b;
}

.messageInput{
  flex:1;
  background:#151d29;
  border:1px solid #2b374a;
  color:#fff;
  padding:13px;
  border-radius:14px;
  outline:none;
}

.iconButton{
  width:46px;
  height:46px;
  border:0;
  border-radius:13px;
  background:#192333;
  color:#fff;
  font-size:21px;
}

.sendButton{
  width:52px;
  height:46px;
  border:0;
  border-radius:13px;
  background:#248cff;
  color:#fff;
  font-size:20px;
}

#photoInput{
  display:none;
}

.mobileBack{
  display:none;
}

/* LOADING */
.loading{
  padding:20px;
  color:#7e899a;
  text-align:center;
}

@media(max-width:700px){
  .sidebar{
    width:100%;
    border-right:0;
  }

  .chat{
    display:none;
  }

  #appScreen.chatOpen .sidebar{
    display:none;
  }

  #appScreen.chatOpen .chat{
    display:flex;
  }

  .mobileBack{
    display:block;
    border:0;
    background:transparent;
    color:#fff;
    font-size:25px;
    padding:5px;
  }

  .message{
    max-width:84%;
  }
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->
<section id="authScreen">
  <div class="authBox">

    <div class="logo">🔒 Private Chat</div>
    <div class="subtitle">Secure 1-to-1 chatting</div>

    <div id="loginArea">
      <h2>Login</h2>

      <input
        id="loginEmail"
        class="input"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        class="input"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginBtn" class="primary">
        Login
      </button>

      <button id="showSignupBtn" class="secondary">
        Create new account
      </button>
    </div>

    <div id="signupArea" class="hidden">
      <h2>Create account</h2>

      <input
        id="signupEmail"
        class="input"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="signupPassword"
        class="input"
        type="password"
        placeholder="Password (minimum 6 characters)"
        autocomplete="new-password"
      >

      <button id="signupBtn" class="primary">
        Sign Up
      </button>

      <button id="showLoginBtn" class="secondary">
        Back to Login
      </button>
    </div>

    <div id="authMessage" class="authMessage"></div>

  </div>
</section>


<!-- MAIN APP -->
<section id="appScreen" class="hidden">

  <aside class="sidebar">

    <div class="sideHeader">
      <h1>💬 Private Chat</h1>
      <div id="currentEmail" class="userEmail"></div>
    </div>

    <div class="searchBox">
      <input
        id="searchInput"
        class="input"
        style="margin:0"
        type="text"
        placeholder="Search users..."
      >
    </div>

    <div id="userList" class="userList">
      <div class="loading">Loading users...</div>
    </div>

    <div class="sideBottom">
      <button id="logoutBtn" class="logout">
        🚪 Logout
      </button>
    </div>

  </aside>


  <main class="chat">

    <header class="chatHeader">

      <button id="backBtn" class="mobileBack">
        ‹
      </button>

      <div id="chatAvatar" class="avatar">
        ?
      </div>

      <div class="chatHeaderInfo">
        <strong id="chatUserName">Select a user</strong>
        <small id="chatUserStatus">
          Private conversation
        </small>
      </div>

    </header>


    <div id="messages" class="messages">
      <div class="empty">
        👋<br><br>
        Select someone from the list<br>
        to start a private chat.
      </div>
    </div>


    <div class="composer">

      <input
        id="photoInput"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

      <button id="photoBtn" class="iconButton" title="Send photo">
        📷
      </button>

      <input
        id="messageInput"
        class="messageInput"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button id="sendBtn" class="sendButton">
        ➤
      </button>

    </div>

  </main>

</section>


<script>
/* ==============================
   SUPABASE CONFIG
============================== */

const SUPABASE_URL =
  "https://zbwpgepgzhfewucacpfc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_0CsxNclnpApy0WM0ajFMpA_nqfSu18A";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==============================
   GLOBAL VARIABLES
============================== */

let currentUser = null;
let selectedUser = null;
let currentConversation = null;
let messageChannel = null;
let allUsers = [];


/* ==============================
   ELEMENTS
============================== */

const authScreen =
  document.getElementById("authScreen");

const appScreen =
  document.getElementById("appScreen");

const loginArea =
  document.getElementById("loginArea");

const signupArea =
  document.getElementById("signupArea");

const authMessage =
  document.getElementById("authMessage");

const userList =
  document.getElementById("userList");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const photoInput =
  document.getElementById("photoInput");


/* ==============================
   AUTH UI
============================== */

document
  .getElementById("showSignupBtn")
  .addEventListener("click", () => {

    loginArea.classList.add("hidden");
    signupArea.classList.remove("hidden");
    authMessage.textContent = "";

  });


document
  .getElementById("showLoginBtn")
  .addEventListener("click", () => {

    signupArea.classList.add("hidden");
    loginArea.classList.remove("hidden");
    authMessage.textContent = "";

  });


/* ==============================
   SIGN UP
============================== */

document
  .getElementById("signupBtn")
  .addEventListener("click", async () => {

    const email =
      document.getElementById("signupEmail")
        .value.trim();

    const password =
      document.getElementById("signupPassword")
        .value;

    if (!email || !password) {
      authMessage.textContent =
        "Please enter email and password.";
      return;
    }

    if (password.length < 6) {
      authMessage.textContent =
        "Password must be at least 6 characters.";
      return;
    }

    authMessage.textContent =
      "Creating account...";

    const { data, error } =
  await supabaseClient.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo:
        "https://jindabakedamdam-droid.github.io/private-chat/"
    }
  });
    if (error) {
      authMessage.textContent =
        error.message;
      return;
    }

    if (data.session) {
      authMessage.textContent =
        "Account created successfully.";
    } else {
      authMessage.textContent =
        "Account created! Check your email and confirm your account, then login.";
    }

  });


/* ==============================
   LOGIN
============================== */

document
  .getElementById("loginBtn")
  .addEventListener("click", async () => {

    const email =
      document.getElementById("loginEmail")
        .value.trim();

    const password =
      document.getElementById("loginPassword")
        .value;

    if (!email || !password) {
      authMessage.textContent =
        "Please enter email and password.";
      return;
    }

    authMessage.textContent =
      "Logging in...";

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      authMessage.textContent =
        error.message;
      return;
    }

    authMessage.textContent = "";

  });


/* ==============================
   LOGOUT
============================== */

document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    if (messageChannel) {
      await supabaseClient
        .removeChannel(messageChannel);

      messageChannel = null;
    }

    await supabaseClient.auth.signOut();

  });


/* ==============================
   AUTH STATE
============================== */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (session && session.user) {

      currentUser = session.user;

      authScreen.classList.add("hidden");
      appScreen.classList.remove("hidden");

      document.getElementById("currentEmail")
        .textContent = currentUser.email || "";

      await loadUsers();

    } else {

      currentUser = null;
      selectedUser = null;
      currentConversation = null;

      authScreen.classList.remove("hidden");
      appScreen.classList.add("hidden");

    }

  }
);


/* ==============================
   LOAD USERS
============================== */

async function loadUsers() {

  userList.innerHTML =
    '<div class="loading">Loading users...</div>';

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("id,email,created_at")
      .neq("id", currentUser.id)
      .order("created_at", { ascending:true });

  if (error) {

    userList.innerHTML =
      '<div class="loading">Unable to load users.</div>';

    console.error(error);
    return;
  }

  allUsers = data || [];

  renderUsers(allUsers);
}


/* ==============================
   RENDER USERS
============================== */

function renderUsers(users) {

  if (!users.length) {

    userList.innerHTML =
      '<div class="loading">No other users yet.</div>';

    return;
  }

  userList.innerHTML = "";

  users.forEach(user => {

    const item =
      document.createElement("div");

    item.className = "userItem";

    const avatar =
      document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
      (user.email || "?")
        .charAt(0)
        .toUpperCase();

    const info =
      document.createElement("div");

    info.className = "userInfo";

    const name =
      document.createElement("strong");

    name.textContent =
      user.email || "User";

    const status =
      document.createElement("small");

    status.textContent =
      "Tap to chat";

    info.appendChild(name);
    info.appendChild(status);

    item.appendChild(avatar);
    item.appendChild(info);

    item.addEventListener(
      "click",
      () => openChat(user)
    );

    userList.appendChild(item);

  });
}


/* ==============================
   SEARCH
============================== */

document
  .getElementById("searchInput")
  .addEventListener("input", event => {

    const query =
      event.target.value
        .trim()
        .toLowerCase();

    if (!query) {
      renderUsers(allUsers);
      return;
    }

    const filtered =
      allUsers.filter(user =>
        (user.email || "")
          .toLowerCase()
          .includes(query)
      );

    renderUsers(filtered);

  });


/* ==============================
   OPEN CHAT
============================== */

async function openChat(user) {

  selectedUser = user;

  appScreen.classList.add("chatOpen");

  document.getElementById("chatUserName")
    .textContent = user.email || "User";

  document.getElementById("chatAvatar")
    .textContent =
      (user.email || "?")
        .charAt(0)
        .toUpperCase();

  messages.innerHTML =
    '<div class="loading">Opening chat...</div>';

  currentConversation =
    await getOrCreateConversation(
      currentUser.id,
      selectedUser.id
    );

  if (!currentConversation) {
    messages.innerHTML =
      '<div class="empty">Could not open conversation.</div>';
    return;
  }

  await loadMessages();

  subscribeToMessages();

}


/* ==============================
   CONVERSATION
============================== */

async function getOrCreateConversation(
  uidA,
  uidB
) {

  const ids =
    [uidA, uidB].sort();

  const user1 = ids[0];
  const user2 = ids[1];

  let { data, error } =
    await supabaseClient
      .from("conversations")
      .select("*")
      .eq("user1", user1)
      .eq("user2", user2)
      .maybeSingle();

  if (error) {

    console.error(error);
    return null;

  }

  if (data) {
    return data;
  }

  const result =
    await supabaseClient
      .from("conversations")
      .insert({
        user1,
        user2
      })
      .select()
      .single();

  if (result.error) {

    /* Another request may have created it */
    const retry =
      await supabaseClient
        .from("conversations")
        .select("*")
        .eq("user1", user1)
        .eq("user2", user2)
        .maybeSingle();

    if (retry.data) {
      return retry.data;
    }

    console.error(result.error);
    return null;
  }

  return result.data;
}


/* ==============================
   LOAD MESSAGES
============================== */

async function loadMessages() {

  if (!currentConversation) return;

  const { data, error } =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "conversation_id",
        currentConversation.id
      )
      .order("created_at", {
        ascending:true
      });

  if (error) {

    console.error(error);

    messages.innerHTML =
      '<div class="empty">Unable to load messages.</div>';

    return;
  }

  messages.innerHTML = "";

  if (!data || !data.length) {

    messages.innerHTML =
      '<div class="empty">No messages yet.<br>Say hello 👋</div>';

    return;
  }

  for (const msg of data) {
    await renderMessage(msg);
  }

  scrollMessages();

}


/* ==============================
   RENDER MESSAGE
============================== */

async function renderMessage(msg) {

  const wrapper = document.createElement("div");

  wrapper.className =
    "message " +
    (msg.sender_id === currentUser.id
      ? "mine"
      : "theirs");

  if (msg.text) {

    const text = document.createElement("div");

    text.textContent = msg.text;

    wrapper.appendChild(text);
  }

  const time =
    document.createElement("span");

  time.textContent =
    new Date(msg.created_at).toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });

  time.className = "messageTime";

  if (msg.photo_path) {

    const img =
      document.createElement("img");

    img.className = "photo";

    img.alt = "Private photo";

    img.loading = "lazy";

    const { data, error } =
      await supabaseClient
        .storage
        .from("chat-photos")
        .createSignedUrl(
          msg.photo_path,
          3600
        );

    if (!error && data && data.signedUrl) {

      img.src = data.signedUrl;

      img.addEventListener("click", () => {
        window.open(
          data.signedUrl,
          "_blank"
        );
      });

      wrapper.appendChild(img);
    }
  }

  wrapper.appendChild(time);

  messages.appendChild(wrapper);
}
/* ==============================
   REALTIME
============================== */

function subscribeToMessages() {

  if (!currentConversation) return;

  if (messageChannel) {

    supabaseClient
      .removeChannel(messageChannel);

    messageChannel = null;
  }

  messageChannel =
    supabaseClient
      .channel(
        "messages-" +
        currentConversation.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            currentConversation.id
        },
        async payload => {

          const oldEmpty =
            messages.querySelector(".empty");

          if (oldEmpty) {
            oldEmpty.remove();
          }

          await renderMessage(
            payload.new
          );

          scrollMessages();

        }
      )
      .subscribe();

}


/* ==============================
   SEND TEXT
============================== */

async function sendMessage() {

  if (!currentUser ||
      !selectedUser ||
      !currentConversation) {
    return;
  }

  const text = messageInput.value.trim();

  if (!text) return;

  messageInput.disabled = true;

  const { data, error } =
    await supabaseClient
      .from("messages")
      .insert({
        conversation_id: currentConversation.id,
        sender_id: currentUser.id,
        text: text
      })
      .select()
      .single();

  messageInput.disabled = false;

  if (error) {
    alert("Message could not be sent: " + error.message);
    return;
  }
messageInput.value = "";
messageInput.focus();

  await loadMessages();
  scrollMessages();
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

document.getElementById("photoBtn").addEventListener("click", () => {
  photoInput.click();
});

photoInput.addEventListener("change", async event => {

  const file = event.target.files[0];

  if (!file) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    alert("Only JPG, PNG and WebP images are allowed.");
    photoInput.value = "";
    return;
  }

  if (file.size > 10 * 1024 * 1024) {
    alert("Photo must be smaller than 10 MB.");
    photoInput.value = "";
    return;
  }

  if (!currentUser || !selectedUser || !currentConversation) {
    photoInput.value = "";
    return;
  }

  const button = document.getElementById("photoBtn");

  button.disabled = true;
  button.textContent = "⏳";

  try {

    const ids = [currentUser.id, selectedUser.id].sort();

    const extension =
      file.name.split(".").pop().toLowerCase();

    const filename =
      Date.now() + "-" +
      crypto.randomUUID() + "." +
      extension;

    const path =
      ids[0] + "/" +
      ids[1] + "/" +
      filename;

    const upload =
      await supabaseClient
        .storage
        .from("chat-photos")
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

    if (upload.error) {
      throw upload.error;
    }

    const { error: messageError } =
      await supabaseClient
        .from("messages")
        .insert({
          conversation_id: currentConversation.id,
          sender_id: currentUser.id,
          photo_path: path
        });

    if (messageError) {
      throw messageError;
    }

    await loadMessages();

  } catch (error) {

    console.error("Photo send error:", error);

    alert(
      "Photo send nahi hui: " +
      (error.message || "Unknown error")
    );

  } finally {

    photoInput.value = "";
    button.disabled = false;
    button.textContent = "📷";

  }

});
document.getElementById("backBtn").addEventListener("click", () => {
  appScreen.classList.remove("chatOpen");
  selectedUser = null;

  if (messageChannel) {
    supabaseClient.removeChannel(messageChannel);
    messageChannel = null;
  }
});

function scrollMessages() {
  messages.scrollTop = messages.scrollHeight;
}

function formatTime(value) {
  if (!value) return "";

  return new Date(value).toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

(async function() {
  const { data } = await supabaseClient.auth.getSession();

  if (data && data.session && data.session.user) {
    currentUser = data.session.user;

    authScreen.classList.add("hidden");
    appScreen.classList.remove("hidden");

    document.getElementById("currentEmail").textContent =
      currentUser.email || "";

    await loadUsers();
  }
})();

    
</script>
