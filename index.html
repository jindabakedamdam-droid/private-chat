<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #fff;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100vh;
    }

    /* LOGIN */

    #authScreen {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      background: #181b22;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .auth-box h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9da3ae;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #c8ccd4;
      font-size: 14px;
    }

    .field input {
      width: 100%;
      padding: 14px;
      border: 1px solid #343945;
      border-radius: 12px;
      background: #101218;
      color: #fff;
      outline: none;
    }

    .field input:focus {
      border-color: #4d8dff;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #3478f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .secondary-btn {
      width: 100%;
      padding: 13px;
      border: 1px solid #3b404c;
      border-radius: 12px;
      background: transparent;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      color: #ff8f8f;
      font-size: 14px;
      line-height: 1.5;
    }

    /* APP */

    #appScreen {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #181b22;
      border-bottom: 1px solid #292d36;
    }

    .topbar-title {
      font-size: 20px;
      font-weight: bold;
    }

    .logout {
      background: #252a34;
      border: 0;
      color: white;
      padding: 9px 13px;
      border-radius: 10px;
      cursor: pointer;
    }

    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 320px;
      border-right: 1px solid #292d36;
      background: #13161c;
      padding: 15px;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .search-box {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #343945;
      background: #0e1015;
      color: white;
      margin-bottom: 12px;
    }

    .user-card {
      padding: 13px;
      background: #1b1f27;
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .user-card:hover {
      background: #252b36;
    }

    .user-name {
      font-weight: bold;
    }

    .user-email {
      color: #9299a6;
      font-size: 12px;
      margin-top: 4px;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      height: 65px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #181b22;
      border-bottom: 1px solid #292d36;
    }

    .chat-header-name {
      font-weight: bold;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .empty-chat {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777f8c;
      text-align: center;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 13px;
      margin-bottom: 9px;
      border-radius: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .mine {
      margin-left: auto;
      background: #3478f6;
      border-bottom-right-radius: 4px;
    }

    .theirs {
      margin-right: auto;
      background: #272c35;
      border-bottom-left-radius: 4px;
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #181b22;
      border-top: 1px solid #292d36;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #343945;
      background: #0e1015;
      color: white;
      outline: none;
    }

    .send-btn {
      width: 55px;
      border: 0;
      border-radius: 12px;
      background: #3478f6;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      color: #9da3ae;
      padding: 20px;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
      }

      .chat-area {
        display: none;
      }

      .content.chat-open .sidebar {
        display: none;
      }

      .content.chat-open .chat-area {
        display: flex;
      }

      .chat-header::before {
        content: "‹";
        font-size: 32px;
        margin-right: 15px;
        cursor: pointer;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN / SIGNUP -->
  <section id="authScreen" class="screen">
    <div class="auth-box">

      <div class="logo">💬</div>

      <h1>Private Chat</h1>

      <p class="subtitle">
        Secure one-to-one messaging
      </p>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="Enter your email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password">
      </div>

      <button id="loginBtn" class="primary-btn">
        Login
      </button>

      <button id="signupBtn" class="secondary-btn">
        Create Account
      </button>

      <div id="authMessage" class="message"></div>

    </div>
  </section>


  <!-- MAIN APP -->
  <section id="appScreen" class="screen hidden">

    <header class="topbar">
      <div class="topbar-title">
        💬 Private Chat
      </div>

      <button id="logoutBtn" class="logout">
        Logout
      </button>
    </header>

    <main id="mainContent" class="content">

      <!-- USERS -->
      <aside class="sidebar">

        <h2>People</h2>

        <input
          id="userSearch"
          class="search-box"
          type="text"
          placeholder="Search users..."
        >

        <div id="usersList">
          <div class="loading">
            Loading users...
          </div>
        </div>

      </aside>


      <!-- CHAT -->
      <section class="chat-area">

        <header class="chat-header">
          <div id="chatHeaderName" class="chat-header-name">
            Select a person to chat
          </div>
        </header>

        <div id="messages" class="messages">

          <div class="empty-chat">
            Select a person from the list to start a private chat.
          </div>

        </div>

        <div class="composer">

          <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
          >

          <button id="sendBtn" class="send-btn">
            ➤
          </button>

        </div>

      </section>

    </main>

  </section>


  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <script>

    /* =====================================================
       FIREBASE CONFIG
       YAHAN APNE FIREBASE WEB APP KA CONFIG PASTE KARNA HAI
       ===================================================== */

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain: "YOUR_PROJECT.firebaseapp.com",

      projectId: "YOUR_PROJECT_ID",

      storageBucket: "YOUR_PROJECT.appspot.com",

      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

      appId: "YOUR_APP_ID"

    };


    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const db = firebase.firestore();


    /* =====================================================
       VARIABLES
       ===================================================== */

    let currentUser = null;

    let selectedUser = null;

    let selectedConversationId = null;

    let unsubscribeMessages = null;


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const authScreen =
      document.getElementById("authScreen");

    const appScreen =
      document.getElementById("appScreen");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const signupBtn =
      document.getElementById("signupBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const authMessage =
      document.getElementById("authMessage");

    const usersList =
      document.getElementById("usersList");

    const userSearch =
      document.getElementById("userSearch");

    const chatHeaderName =
      document.getElementById("chatHeaderName");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const mainContent =
      document.getElementById("mainContent");


    /* =====================================================
       AUTH
       ===================================================== */

    signupBtn.addEventListener("click", async () => {

      const email = emailInput.value.trim();

      const password = passwordInput.value;

      authMessage.textContent = "";

      if (!email || !password) {

        authMessage.textContent =
          "Email aur password enter karo.";

        return;
      }

      if (password.length < 6) {

        authMessage.textContent =
          "Password kam se kam 6 characters ka hona chahiye.";

        return;
      }

      try {

        const result =
          await auth.createUserWithEmailAndPassword(
            email,
            password
          );

        const user = result.user;

        await db
          .collection("users")
          .doc(user.uid)
          .set({
            uid: user.uid,
            email: user.email,
            createdAt:
              firebase.firestore.FieldValue.serverTimestamp()
          });

        authMessage.style.color = "#7dff9c";

        authMessage.textContent =
          "Account successfully created!";

      } catch (error) {

        authMessage.style.color = "#ff8f8f";

        authMessage.textContent =
          error.message;
      }

    });


    loginBtn.addEventListener("click", async () => {

      const email = emailInput.value.trim();

      const password = passwordInput.value;

      authMessage.textContent = "";

      try {

        await auth.signInWithEmailAndPassword(
          email,
          password
        );

      } catch (error) {

        authMessage.textContent =
          error.message;
      }

    });


    logoutBtn.addEventListener("click", async () => {

      await auth.signOut();

    });


    /* =====================================================
       AUTH STATE
       ===================================================== */

    auth.onAuthStateChanged(async (user) => {

      if (user) {

        currentUser = user;

        authScreen.classList.add("hidden");

        appScreen.classList.remove("hidden");

        await createMissingProfile();

        loadUsers();

      } else {

        currentUser = null;

        authScreen.classList.remove("hidden");

        appScreen.classList.add("hidden");

        if (unsubscribeMessages) {

          unsubscribeMessages();

          unsubscribeMessages = null;
        }

      }

    });


    /* =====================================================
       CREATE PROFILE IF MISSING
       ===================================================== */

    async function createMissingProfile() {

      const ref =
        db.collection("users")
          .doc(currentUser.uid);

      const snap = await ref.get();

      if (!snap.exists) {

        await ref.set({

          uid: currentUser.uid,

          email: currentUser.email,

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });

      }

    }


    /* =====================================================
       LOAD USERS
       ===================================================== */

    let allUsers = [];

    async function loadUsers() {

      usersList.innerHTML =
        '<div class="loading">Loading users...</div>';

      try {

        const snapshot =
          await db.collection("users").get();

        allUsers = [];

        snapshot.forEach(doc => {

          const data = doc.data();

          if (data.uid !== currentUser.uid) {

            allUsers.push(data);

          }

        });

        renderUsers(allUsers);

      } catch (error) {

        usersList.innerHTML =
          '<div class="loading">Users load nahi ho paaye.</div>';

        console.error(error);

      }

    }


    function renderUsers(users) {

      usersList.innerHTML = "";

      if (users.length === 0) {

        usersList.innerHTML =
          '<div class="loading">Abhi koi aur user nahi hai.</div>';

        return;
      }

      users.forEach(user => {

        const card =
          document.createElement("div");

        card.className = "user-card";

        card.innerHTML = `

          <div class="user-name">
            👤 ${escapeHtml(user.email || "User")}
          </div>

          <div class="user-email">
            Tap to start private chat
          </div>

        `;

        card.addEventListener("click", () => {

          openChat(user);

        });

        usersList.appendChild(card);

      });

    }


    /* =====================================================
       USER SEARCH
       ===================================================== */

    userSearch.addEventListener("input", () => {

      const text =
        userSearch.value
          .toLowerCase()
          .trim();

      const filtered =
        allUsers.filter(user =>
          (user.email || "")
            .toLowerCase()
            .includes(text)
        );

      renderUsers(filtered);

    });


    /* =====================================================
       CONVERSATION ID
       ===================================================== */

    function getConversationId(uid1, uid2) {

      return [uid1, uid2]
        .sort()
        .join("_");

    }


    /* =====================================================
       OPEN CHAT
       ===================================================== */

    async function openChat(user) {

      selectedUser = user;

      selectedConversationId =
        getConversationId(
          currentUser.uid,
          user.uid
        );

      chatHeaderName.textContent =
        user.email || "User";

      mainContent.classList.add("chat-open");

      messages.innerHTML =
        '<div class="loading">Loading messages...</div>';

      await createConversation();

      listenForMessages();

    }


    /* =====================================================
       CREATE CONVERSATION
       ===================================================== */

    async function createConversation() {

      const ref =
        db.collection("conversations")
          .doc(selectedConversationId);

      const snap = await ref.get();

      if (!snap.exists) {

        await ref.set({

          participants: [
            currentUser.uid,
            selectedUser.uid
          ],

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });

      }

    }


    /* =====================================================
       REAL-TIME MESSAGES
       ===================================================== */

    function listenForMessages() {

      if (unsubscribeMessages) {

        unsubscribeMessages();

      }

      unsubscribeMessages =
        db
          .collection("conversations")
          .doc(selectedConversationId)
          .collection("messages")
          .orderBy("createdAt", "asc")
          .onSnapshot(snapshot => {

            messages.innerHTML = "";

            if (snapshot.empty) {

              messages.innerHTML = `
                <div class="empty-chat">
                  No messages yet.<br>
                  Send your first message.
                </div>
              `;

              return;
            }

            snapshot.forEach(doc => {

              const data = doc.data();

              const bubble =
                document.createElement("div");

              bubble.className =
                "bubble " +
                (
                  data.senderId === currentUser.uid
                    ? "mine"
                    : "theirs"
                );

              bubble.textContent =
                data.text || "";

              messages.appendChild(bubble);

            });

            messages.scrollTop =
              messages.scrollHeight;

          }, error => {

            console.error(error);

            messages.innerHTML = `
              <div class="empty-chat">
                Messages load nahi ho paaye.
              </div>
            `;

          });

    }


    /* =====================================================
       SEND MESSAGE
       ===================================================== */

    async function sendMessage() {

      const text =
        messageInput.value.trim();

      if (!text) return;

      if (!currentUser || !selectedUser) {

        alert("Pehle kisi user ko select karo.");

        return;
      }

      messageInput.value = "";

      try {

        await db
          .collection("conversations")
          .doc(selectedConversationId)
          .collection("messages")
          .add({

            senderId: currentUser.uid,

            text: text,

            createdAt:
              firebase.firestore.FieldValue.serverTimestamp()

          });

      } catch (error) {

        console.error(error);

        alert(
          "Message send nahi hua: " +
          error.message
        );

        messageInput.value = text;

      }

    }


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =====================================================
       HTML ESCAPE
       ===================================================== */

    function escapeHtml(value) {

      return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }

  </script>

</body>
        </html>
